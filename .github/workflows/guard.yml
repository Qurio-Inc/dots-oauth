# Public repo guard: only the allowed files, and nothing that looks like a secret or private data.
name: guard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only allowed files
        run: |
          bad=$(git ls-files | grep -Ev '^(README\.md|\.github/workflows/guard\.yml|[a-z0-9-]+/index\.html)$' || true)
          if [ -n "$bad" ]; then echo "Not allowed in this public repo:"; echo "$bad"; exit 1; fi
      - name: No secrets or private data
        run: |
          pattern='xox[abpr]-|sk-[A-Za-z0-9_-]{16,}|ghp_|github_pat_|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY|client_secret|[0-9a-f]{32}|[0-9]{8,}\.[0-9]{8,}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}|(^|[^0-9])(10|172|192)\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|ts\.net'
          if git grep -nEI "$pattern" -- . ':!README.md' ':!.github/workflows/guard.yml'; then
            echo "Something that looks like a secret or private data is in a public file."; exit 1
          fi
      - name: Pages stay self-contained
        run: |
          if git grep -nE '<script[^>]+src=|<link[^>]+href=|https?://' -- '*.html'; then
            echo "HTML pages must not load or link anything external."; exit 1
          fi
